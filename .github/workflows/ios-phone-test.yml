name: iPhone test
# Walks through KidArmor on virtual iPhones (small SE, standard, Pro Max, Air, and an older iOS):
# screen layout, recording, photo picker, reminders, calendar, Face ID, PDF binder and share sheet, reopening.
on:
  workflow_dispatch:
    inputs:
      only: { description: "Run only these steps (rpc = quick check only; or layout,record,photo,remind,calendar,faceid,pdf,restart). Blank = all", required: false, default: "" }
      mac: { description: "Mac to use (macos-15, macos-26, macos-15-intel)", required: false, default: "macos-15" }
      devices: { description: "Only these phones (SE,Standard,ProMax,Air,Older iOS). Blank = all", required: false, default: "" }
permissions:
  contents: write
concurrency:
  group: iphone-test
  cancel-in-progress: true
jobs:
  plan: # which phones; each one then runs on its own Mac at the same time
    runs-on: ubuntu-latest
    outputs: { phones: "${{ steps.p.outputs.phones }}" }
    steps:
      - id: p
        env: { DEVICES: "${{ github.event.inputs.devices }}" }
        run: |
          python3 -c "import json,os;a=['SE','Standard','ProMax','Air','Older iOS'];w=[x.strip() for x in os.environ.get('DEVICES','').split(',') if x.strip()];print('phones='+json.dumps([x for x in a if not w or x in w]))" >> "$GITHUB_OUTPUT"
  iphone:
    needs: plan
    strategy:
      fail-fast: false
      matrix: { phone: "${{ fromJSON(needs.plan.outputs.phones) }}" }
    name: iphone (${{ matrix.phone }})
    runs-on: ${{ github.event.inputs.mac || 'macos-15' }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Build the test app and walk through it on virtual iPhones
        env:
          ONLY: ${{ github.event.inputs.only }}
          DEVICES: ${{ matrix.phone }}
          OUT: sim
        run: bash tests/ios/run.sh
      - name: Keep results (download from the run page)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "iphone-results-${{ strategy.job-index }}", path: sim, retention-days: 14 }
      - name: Save results
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: bash native/scripts/push-dir.sh "iphone-$(echo '${{ matrix.phone }}' | tr ' ' '-')" sim
