name: Android quick check
# Quick check on one virtual phone with the test build: lists script errors at startup.
on:
  workflow_dispatch:
    inputs:
      api: { description: "Android API level", required: false, default: "29" }
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download android-test -p KidArmor-test.apk -R "$GITHUB_REPOSITORY"
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env: { OUT: probe }
        with:
          api-level: ${{ github.event.inputs.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-boot-timeout: 900
          script: adb wait-for-device && sleep 20 && adb install -r KidArmor-test.apk && node tests/android/probe.mjs
      - if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: bash native/scripts/push-dir.sh probe-${{ github.event.inputs.api }} probe
