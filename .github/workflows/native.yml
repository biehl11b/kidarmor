name: Build phone apps
on:
  push:
    branches: [main]
    paths: ["native/**", "!native/**/*.md", ".github/workflows/native.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
# Security notes:
# - Actions are pinned to exact commits.
# - The repo token is given only to the steps that push logs or the test build, and checkout does not keep it.
# - The Android signing key is only available in the signing step, after all packages are installed and built.
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: 21 }
      - name: Build Android test app
        working-directory: native
        run: bash scripts/ci-android.sh 2>&1 | tee build-android.log
      - name: Sign store bundle (only when the signing key is set up)
        working-directory: native
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: bash scripts/ci-android-sign.sh 2>&1 | tee -a build-android.log
      - name: Keep store bundle (private download from the run page)
        if: hashFiles('native/out/KidArmor-store.aab') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: KidArmor-store-bundle
          path: native/out/KidArmor-store.aab
          retention-days: 30
      - name: Publish test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-test -y --cleanup-tag || true
          gh release create android-test native/out/KidArmor-test.apk --title "KidArmor Android test build" --notes "Test build from ${GITHUB_SHA::7}. Install on an Android phone to test." --prerelease
      - name: Save log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash native/scripts/push-log.sh android native/build-android.log ${{ job.status }}
      - name: Enable virtual phone support
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Try it on a virtual Android phone
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: native
          script: bash scripts/ci-emulator.sh
      - name: Save phone test results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash native/scripts/push-dir.sh android-emu native/emu
  ios:
    # Runs only when started by hand until the Apple account is approved (macOS runners queue a long time).
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Build iPhone app (simulator check)
        working-directory: native
        run: bash scripts/ci-ios.sh 2>&1 | tee build-ios.log
      - name: Upload to App Store Connect (only when the Apple key is set up)
        working-directory: native
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: bash scripts/ci-ios-release.sh 2>&1 | tee -a build-ios.log
      - name: Save log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash native/scripts/push-log.sh ios native/build-ios.log ${{ job.status }}
