name: Android phone test
# Walks through KidArmor on virtual Android phones (old, current and newest Android):
# recording, adding a photo, the PDF binder and share sheet, reminders, reopening, back button.
on:
  workflow_dispatch:
    inputs:
      only: { description: "Run only these steps (record,transcribe,photo,pdf,remind,restart,back). Blank = all", required: false, default: "" }
  push:
    branches: [main]
    paths: ["tests/android/**", ".github/workflows/android-phone-test.yml"]
  workflow_run:
    workflows: ["Build phone apps"]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: phone-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  phone:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        api: [31, 34, 36]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Get the latest Android test app
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download android-test -p KidArmor-test.apk -R "$GITHUB_REPOSITORY" && ls -la KidArmor-test.apk
      - name: Make a spoken test recording
        run: |
          sudo apt-get install -y -qq espeak-ng ffmpeg >/dev/null
          espeak-ng -s 140 -w speech.wav "Thank you for meeting with us today. The school agreed to provide speech therapy two times a week. The teacher will send a progress report every Friday. Our next meeting is on December fifth at ten in the morning."
          ffmpeg -loglevel error -y -i speech.wav -ar 48000 -ac 1 -c:a libopus -b:a 32k speech.webm && ls -la speech.webm
      - name: Enable virtual phone support
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Walk through the app on Android API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          ONLY: ${{ github.event.inputs.only }}
          OUT: emu
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash tests/android/run.sh
      - name: Keep results (download from the run page)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "phone-${{ matrix.api }}", path: emu, retention-days: 14 }
      - name: Save results
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: bash native/scripts/push-dir.sh phone-${{ matrix.api }} emu
